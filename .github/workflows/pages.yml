name: Deploy viewer to GitHub Pages

# Manual only. The live site is published from the gh-pages branch: uploading
# the 87 MB site through actions/deploy-pages stalled for over twenty minutes,
# while the branch deploy completes in about a minute. Kept for the day the
# Pages service behaves better.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
